# Model mapping — ONE source of truth for ALL modes.
# Edit a line, then run:  ~/.claude/local-mode/sync-local.sh
#
# Format:   <role> = <model-tag>
#
# sync-local.sh applies this file everywhere:
#   plain roles    -> ~/.claude-local/agents frontmatter + models.env (full-local mode)
#   tier.* roles   -> tiers.json, read by the ollama-delegate MCP (ollama_run)
#   claude.* roles -> ~/.claude/agents frontmatter (hybrid mode subagents)
# Context window is controlled globally by the server's OLLAMA_CONTEXT_LENGTH.
# Auto-suggest from installed models:  ~/.claude/local-mode/sync-local.sh --detect

# --- Full-local mode (claude --local): role -> Ollama tag -------------------
# Role -> subagent:   orchestrator=main+reviewer  code=implementer
#                     explore=explorer  reverse=reverse-engineer  cheap=background
# Swap the reverse model:  `ollama pull X`  ->  set `reverse = X`  ->  re-sync.

orchestrator = qwen3-coder:30b           # coder MoE — 139 tok/s, orchestrates coding well (qwen3.6:35b tested at 13 tok/s, too slow)
code         = qwen3-coder:30b           # coder MoE (3B active) — fast & cool, code generation / editing
reverse      = qwen3-coder:30b           # MUST be tool-capable to drive radare2 (dolphin-mixtral has NO tool support). Uncensored passes via ollama_run -> dolphin-mixtral.
explore      = gemma4:latest             # fast read-only recon
cheap        = gemma4:latest             # summaries / background / drafts

# --- ollama_run tiers (both modes): tier -> Ollama tag ----------------------
# One-shot delegation can afford a bigger/slower model than full-local
# orchestration, hence the separate mapping.

tier.code  = qwen3-coder:30b             # real code generation / analysis
tier.cheap = gemma4:latest               # summaries / classification / drafts
tier.tiny  = llama2-uncensored:latest    # trivial text munging (antique — replace when a better small model is pulled)

# --- Hybrid mode (default claude): Claude model per subagent ----------------
# Aliases (haiku/sonnet/opus) or full model ids, written into ~/.claude/agents.
# The MAIN orchestrator model is NOT set here — it is whatever the session is
# configured with (settings.json `model` / the /model command).

claude.explorer         = haiku
claude.implementer      = sonnet
claude.reviewer         = opus
claude.reverse-engineer = opus
claude.ui-tester        = sonnet
claude.ui-tester-headed = sonnet
