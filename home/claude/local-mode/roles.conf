# Model mapping — ONE source of truth for ALL modes.
# Edit a line, then run:  ~/.claude/local-mode/sync-local.sh
#
# Format:   <role> = <model-tag>
#
# sync-local.sh applies this file everywhere:
#   plain roles    -> ~/.claude-local/agents frontmatter + models.env (full-local mode)
#   tier.* roles   -> tiers.json, read by the ollama-delegate MCP (ollama_run)
#   claude.* roles -> ~/.claude/agents frontmatter (hybrid mode subagents)
# Context window is controlled globally by the server's OLLAMA_CONTEXT_LENGTH.
# Auto-suggest from installed models:  ~/.claude/local-mode/sync-local.sh --detect

# --- Full-local mode (claude --local): role -> Ollama tag -------------------
# Role -> subagent:   orchestrator=main+reviewer  code=implementer
#                     explore=explorer  reverse=reverse-engineer  cheap=background
# Swap the reverse model:  `ollama pull X`  ->  set `reverse = X`  ->  re-sync.
# Defaults tuned on an Apple Silicon Mac (128 GB RAM); the MoE defaults run
# well from ~36 GB. install.sh offers to pull these, or pick your own per role.

orchestrator = laguna-xs-2.1             # 33B MoE (3B active) — agentic coder, tools + interleaved thinking, 256K ctx
code         = laguna-xs-2.1             # same speed class as qwen3-coder:30b, far stronger (SWE-bench V 70.9%)
reverse      = laguna-xs-2.1             # MUST be tool-capable to drive radare2 (dolphin-mixtral has NO tool support). Uncensored passes via ollama_run -> dolphin-mixtral.
explore      = gemma4:12b                # fast read-only recon, 256K ctx
cheap        = gemma4:12b                # summaries / background / drafts

# --- ollama_run tiers (both modes): tier -> Ollama tag ----------------------
# One-shot delegation can afford a bigger/slower model than full-local
# orchestration, hence the separate mapping.
# Tested and rejected: qwen3.6:35b dense (13 tok/s, too slow),
# qwen3-coder-next 80B MoE (runs hot, slower than laguna for the same jobs).

tier.code  = laguna-xs-2.1               # real code generation / analysis
tier.cheap = gemma4:12b                  # summaries / classification / drafts
# No "tiny" tier: trivial text munging isn't worth a delegation round-trip —
# the orchestrator does it inline; anything with volume goes to tier.cheap.

# --- Hybrid mode (default claude): Claude model per subagent ----------------
# Aliases (haiku/sonnet/opus/fable) or full model ids, written into
# ~/.claude/agents. The MAIN orchestrator model is NOT set here — it is
# whatever the session is configured with (settings.json / /model).
#
# Match these to your Claude plan's budget with a preset:
#     sync-local.sh --plan pro      haiku recon, sonnet everything else
#     sync-local.sh --plan max100   defaults below (opus for review/reverse)
#     sync-local.sh --plan max200   sonnet recon, opus implementation,
#                                   fable review/reverse (needs Fable access)
# Bigger plan = spend the extra budget where quality compounds (review first,
# implementation second, recon last).

claude.explorer         = haiku
claude.implementer      = sonnet
claude.reviewer         = opus
claude.reverse-engineer = opus
claude.browser-headless = sonnet
claude.browser-headed   = sonnet
